<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <title>メモアプリ</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="memo">
        <header>
            <h2 id="date"></h2>
        </header>
        <ul id="taskList" aria-label="タスクリスト">
            <!-- タスクがここに追加されます -->
        </ul>
        <div class="new-task-row">
            <span class="add-icon" role="button" aria-label="タスク追加">+</span>
            <input type="text" id="newTask" placeholder="リストアイテム" aria-label="新規タスク入力">
        </div>
        <footer class="footer">
            <div class="status" id="status" aria-live="polite"></div>
            <button class="copy-btn" id="copyBtn" aria-label="タスクを日報用にコピー">日報用にコピー</button>
        </footer>
    </main>

    <script src="index.js"></script>
</body>
</html>
